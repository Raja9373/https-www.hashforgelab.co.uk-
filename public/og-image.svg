<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a1a2f" />
      <stop offset="100%" stop-color="#04070e" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <circle cx="600" cy="180" r="280" fill="#00ff88" opacity="0.08" filter="blur(60px)" />
  <circle cx="950" cy="350" r="240" fill="#00d4ff" opacity="0.06" filter="blur(60px)" />

  <!-- Outer frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="2" />

  <!-- Badge -->
  <rect x="80" y="75" width="280" height="40" rx="20" fill="rgba(0,255,136,0.15)" stroke="#00ff88" stroke-width="1.5" />
  <text x="220" y="101" font-family="'Orbitron', sans-serif, system-ui" font-size="14" font-weight="bold" fill="#00ff88" text-anchor="middle">LIVE • 42 LANGUAGES • 180+ COUNTRIES</text>

  <!-- Title -->
  <text x="80" y="200" font-family="'Orbitron', sans-serif, system-ui" font-size="64" font-weight="900" fill="#ffffff">HASHFORGE <tspan fill="#00ff88">LAB</tspan></text>
  <text x="80" y="270" font-family="'Inter', sans-serif, system-ui" font-size="34" font-weight="800" fill="url(#neonGrad)">World's #1 Free Crypto Mining Simulator</text>

  <!-- Description -->
