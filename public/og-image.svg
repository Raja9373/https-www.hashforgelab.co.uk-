    Mine Bitcoin (BTC), Ethereum (ETH), Solana (SOL) &amp; 12+ Coins Free in your browser.
  </text>
  <text x="80" y="365" font-family="'Inter', sans-serif, system-ui" font-size="20" fill="#718096">
    ⚡ 100% Zero Hardware Load • No Electricity Cost • Safe Educational Simulation
  </text>

  <!-- Metrics row -->
  <rect x="80" y="420" width="310" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="110" y="465" font-family="'Orbitron', sans-serif, system-ui" font-size="30" font-weight="900" fill="#00ff88">1,280,000+</text>
  <text x="110" y="500" font-family="'Inter', sans-serif, system-ui" font-size="16" fill="#a0aec0">Active Worldwide Miners</text>

  <rect x="420" y="420" width="310" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="450" y="465" font-family="'Orbitron', sans-serif, system-ui" font-size="30" font-weight="900" fill="#00d4ff">42 Languages</text>
  <text x="450" y="500" font-family="'Inter', sans-serif, system-ui" font-size="16" fill="#a0aec0">Full Global Localization</text>

  <rect x="760" y="420" width="360" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="790" y="465" font-family="'Orbitron', sans-serif, system-ui" font-size="26" font-weight="900" fill="#ffffff">hashforgelab.co.uk</text>
  <text x="790" y="500" font-family="'Inter', sans-serif, system-ui" font-size="16" fill="#00ff88">Free Instant Access • No Wallet</text>
